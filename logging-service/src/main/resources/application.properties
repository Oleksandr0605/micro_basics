    server.port=0

    spring.application.name=logging-server
    spring.cloud.consul.host=localhost
    spring.cloud.consul.port=8500
    spring.cloud.consul.discovery.instanceId=${spring.application.name}:${random.int}
    spring.cloud.consul.discovery.prefer-ip-address=true
    spring.cloud.consul.discovery.ip-address=127.0.0.1

    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always

    spring.cloud.consul.discovery.register-health-check=true

    spring.cloud.consul.discovery.health-check-templates[0].id=http
    spring.cloud.consul.discovery.health-check-templates[0].check=http://${spring.cloud.consul.discovery.ip-address}:${local.server.port}/actuator/health
    spring.cloud.consul.discovery.health-check-templates[0].interval=30s
    spring.cloud.consul.discovery.health-check-templates[0].deregister-critical-service-after=5m


